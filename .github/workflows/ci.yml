name: Build and integration checks

on:
  push:
  pull_request:

jobs:
  windows:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build application
        shell: pwsh
        run: |
          if (Test-Path LanDrop.slnx) {
            dotnet build LanDrop.slnx -c Release
          } else {
            dotnet build src/LanDrop -c Release
          }
      - name: Check browser script syntax
        run: |
          node --check src/LanDrop/wwwroot/app.js
          node --check src/LanDrop/wwwroot/i18n.js
          node --check src/LanDrop/wwwroot/progress.js
          node --check src/LanDrop/wwwroot/offers.js
      - name: Check localization coverage
        run: node tests/localization.cjs
      - name: Check progress calculations
        run: node tests/progress.cjs
      - name: Check phone approval workflow
        run: node tests/offers.cjs
      - name: Run HTTP integration checks
        run: python tests/integration.py
      - name: Check Windows storage safety
        run: python tests/storage_safety.py
      - name: Check network profile policy
        run: dotnet run --project tests/NetworkPolicy -c Release
      - name: Smoke test desktop window
        shell: pwsh
        run: |
          if (Test-Path src/LanDrop.Desktop/LanDrop.Desktop.csproj) {
            dotnet run --project src/LanDrop.Desktop -c Release --no-build -- --smoke-test
          }
      - name: Check desktop server lifecycle
        run: python tests/desktop_lifecycle.py
