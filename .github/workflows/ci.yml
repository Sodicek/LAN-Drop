name: Build and integration checks

on:
  push:
  pull_request:

jobs:
  windows:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild bundled browser hash library
        run: |
          npm ci --ignore-scripts
          npm run build:hash
          git diff --exit-code -- src/LanDrop/wwwroot/vendor
      - name: Build application
        shell: pwsh
        run: |
          if (Test-Path LanDrop.slnx) {
            dotnet build LanDrop.slnx -c Release
          } else {
            dotnet build src/LanDrop -c Release
          }
      - name: Check browser script syntax
        run: |
          node --check src/LanDrop/wwwroot/app.js
          node --check src/LanDrop/wwwroot/i18n.js
          node --check src/LanDrop/wwwroot/progress.js
          node --check src/LanDrop/wwwroot/offers.js
          node --check src/LanDrop/wwwroot/integrity.js
          node --check src/LanDrop/wwwroot/hash-worker.js
          node --check src/LanDrop/wwwroot/mobile.js
          node --check src/LanDrop/wwwroot/queue.js
          node --check src/LanDrop/wwwroot/vendor/sha256.js
      - name: Check localization coverage
        run: node tests/localization.cjs
      - name: Check mobile platform and capability handling
        run: node tests/mobile.cjs
      - name: Check progress calculations
        run: node tests/progress.cjs
      - name: Check phone approval workflow
        run: node tests/offers.cjs
      - name: Check retained phone selections
        run: node tests/queue.cjs
      - name: Check file integrity and saved-file receipts
        run: node tests/integrity.cjs
      - name: Check native saved-file receipts
        run: dotnet run --project tests/DesktopIntegrity -c Release
      - name: Check retained desktop selections
        run: dotnet run --project tests/DesktopQueue -c Release
      - name: Check transport certificates without installing trust roots
        run: dotnet run --project tests/Transport -c Release
      - name: Check real validated HTTPS transfers
        run: python tests/secure_transport.py
      - name: Run HTTP integration checks
        run: python tests/integration.py
      - name: Check grouped consent, retry, and transfer isolation
        run: python tests/batches.py
      - name: Install Chromium and WebKit for mobile browser checks
        run: npx playwright install chromium webkit
      - name: Check Android and iPhone browser emulation
        env:
          LAN_DROP_SCREENSHOT_DIR: ${{ runner.temp }}/landrop-mobile-screenshots
        run: node tests/mobile_browser.cjs
      - name: Check trusted HTTPS in Chromium on the disposable CI runner
        timeout-minutes: 3
        shell: pwsh
        env:
          LAN_DROP_SCREENSHOT_DIR: ${{ runner.temp }}/landrop-mobile-https-screenshots
        run: ./tests/Run-TrustedBrowser.ps1
      - name: Save mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-screenshots
          path: |
            ${{ runner.temp }}/landrop-mobile-screenshots
            ${{ runner.temp }}/landrop-mobile-https-screenshots
          if-no-files-found: ignore
      - name: Check Windows storage safety
        run: python tests/storage_safety.py
      - name: Check network profile policy
        run: dotnet run --project tests/NetworkPolicy -c Release
      - name: Smoke test desktop window
        shell: pwsh
        run: |
          if (Test-Path src/LanDrop.Desktop/LanDrop.Desktop.csproj) {
            dotnet run --project src/LanDrop.Desktop -c Release --no-build -- --smoke-test
          }
      - name: Check desktop server lifecycle
        run: python tests/desktop_lifecycle.py
